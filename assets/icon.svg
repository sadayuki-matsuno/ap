<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Ap app icon: cream clipboard with coral clip; "ap" printed on the paper, p descender is the paste arrow -->
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#352c28"/><stop offset="1" stop-color="#110d0c"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3e4"/><stop offset="1" stop-color="#e6d6bb"/></linearGradient>
<linearGradient id="coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a76"/><stop offset="1" stop-color="#e5532f"/></linearGradient>
<linearGradient id="coralU" gradientUnits="userSpaceOnUse" x1="0" y1="190" x2="0" y2="400"><stop offset="0" stop-color="#ff8a63"/><stop offset="1" stop-color="#df4b28"/></linearGradient>
<radialGradient id="halo" cx="0.5" cy="0.3" r="0.6"><stop offset="0" stop-color="#ff7a59" stop-opacity="0.16"/><stop offset="1" stop-color="#ff7a59" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
<clipPath id="sq"><rect width="512" height="512" rx="114.6"/></clipPath></defs>
<g transform="translate(100,100) scale(1.609375)"><g clip-path="url(#sq)">
<rect width="512" height="512" fill="url(#bg)"/><rect width="512" height="512" fill="url(#halo)"/>

<rect x="116" y="128" width="280" height="300" rx="42" fill="url(#paper)"/>
<rect x="190" y="98" width="132" height="64" rx="24" fill="url(#coral)" stroke="#1a1412" stroke-width="10" paint-order="stroke"/>
<rect x="232" y="114" width="48" height="16" rx="8" fill="#5a2a1c"/>
<g transform="translate(76,114) scale(0.72)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="44">
  <circle cx="154" cy="200" r="56" stroke="#231a17"/><path d="M 210 122.0 V 278.0" stroke="#231a17" stroke-linecap="butt"/>
  <circle cx="346" cy="200" r="56" stroke="url(#coralU)"/><path d="M 290 122.0 V 384" stroke="url(#coralU)" stroke-linecap="butt"/><path d="M 248 342 L 290 384 L 332 342" stroke="url(#coralU)"/>
</g>
</g></g></svg>