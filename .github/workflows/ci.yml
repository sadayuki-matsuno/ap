name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: make test

      # Builds the release ap and ApApp products and assembles build/Ap.app (ad hoc: no certificate on the runner)
      - name: Build app
        run: AP_SIGN_IDENTITY=- make app
